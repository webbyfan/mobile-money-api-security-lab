name: Security Regression Tests

on:
  push:
    branches: [main, v2-secure]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Initialize MongoDB replica set
        run: |
          docker run --rm mongo:7 mongosh "mongodb://localhost:27017" --eval "db.adminCommand('ping')" || true
          docker exec $(docker ps -qf "ancestor=mongo:7") mongosh --eval "rs.initiate()" || true

      - name: Start API
        working-directory: ./app
        env:
          PORT: 3000
          MONGO_URI: "mongodb://localhost:27017/wallet?replicaSet=rs0"
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
        run: |
          node src/server.js &
          sleep 5

      - name: Seed database
        working-directory: ./app
        env:
          MONGO_URI: "mongodb://localhost:27017/wallet?replicaSet=rs0"
        run: node src/seed.js

      - name: Run regression tests
        working-directory: ./app
        env:
          BASE_URL: "http://localhost:3000"
        run: npm test

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/javascript p/owasp-top-ten

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
