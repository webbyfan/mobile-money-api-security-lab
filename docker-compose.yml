services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  api:
    build: ./app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      MONGO_URI: "mongodb://mongo:27017/wallet?replicaSet=rs0"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
